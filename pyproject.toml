[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mail163-readonly-mcp"
version = "0.2.0"
description = "Lightweight, read-only NetEase 163 enterprise mailbox MCP server for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "YourName" }
]
keywords = ["mcp", "model-context-protocol", "163-mail", "read-only", "ai-agent", "email"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
]
dependencies = []

[project.scripts]
mail163-mcp = "mail163_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
